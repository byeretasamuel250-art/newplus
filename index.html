<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>newplus.app: Houses for Rent in Uganda</title>
<meta name="description" content="Browse houses for rent in Uganda by district, area and village. See photos and chat with us directly on WhatsApp.">
<link rel="canonical" href="https://newplus.app/">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFDF5">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="houses.css">
</head>
<body>
<div id="app"><div class="center-loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let sb;
const state = { houses: [], district: "all", search: "" };
const root = () => document.getElementById("app");
const BRAND_HTML = `<div class="brand">newplus<span class="brand-dot">.</span></div>`;

window.addEventListener("DOMContentLoaded", () => {
  try { sb = initSupabase(); } catch (e) { return; }
  renderIntro();
});

function renderIntro() {
  root().innerHTML = `
    ${BRAND_HTML}
    <div class="intro-screen">
      <div class="intro-icons">
        <div class="intro-icon" style="font-size:28px">🏠</div>
        <div class="intro-icon" style="font-size:28px">🏡</div>
        <div class="intro-icon" style="font-size:28px">🏘️</div>
        <div class="intro-icon" style="font-size:28px">🔑</div>
      </div>
      <h1 class="intro-headline">Looking for a house to rent? We have it.</h1>
      <p class="intro-subhead">Browse houses by district, area and village. See the photos, pick the one you like, and chat with us directly on WhatsApp.</p>
      <button class="btn-primary" onclick="openListings()">Get started</button>
    </div>`;
}

const openListings = safeRender(async function () {
  root().innerHTML = `${BRAND_HTML}<div class="center-loading">Loading houses…</div>`;
  const { data, error } = await sb.from("houses").select("*").order("created_at", { ascending: false });
  if (error) throw error;
  state.houses = (data || []).filter(h => h.is_available);
  renderListings();
});

// ---------- helpers ----------
const norm = s => (s || "").trim().replace(/\s+/g, " ");
const key = s => norm(s).toLowerCase();
const photoUrl = path => sb.storage.from("houses").getPublicUrl(path).data.publicUrl;
const fmtRent = n => "UGX " + Number(n).toLocaleString("en-UG");

function visibleHouses() {
  const q = key(state.search);
  return state.houses.filter(h => {
    if (state.district !== "all" && key(h.district) !== state.district) return false;
    if (!q) return true;
    return [h.title, h.district, h.area, h.village].some(v => key(v).includes(q));
  });
}

// district -> area -> village -> [houses], matching names without caring about capital letters
function groupHouses(list) {
  const districts = new Map();
  for (const h of list) {
    const dk = key(h.district), ak = key(h.area), vk = key(h.village) || "_";
    if (!districts.has(dk)) districts.set(dk, { name: norm(h.district), areas: new Map() });
    const d = districts.get(dk);
    if (!d.areas.has(ak)) d.areas.set(ak, { name: norm(h.area), villages: new Map() });
    const a = d.areas.get(ak);
    if (!a.villages.has(vk)) a.villages.set(vk, { name: norm(h.village), houses: [] });
    a.villages.get(vk).houses.push(h);
  }
  const byName = (x, y) => x.name.localeCompare(y.name);
  return [...districts.values()].sort(byName).map(d => ({
    name: d.name,
    areas: [...d.areas.values()].sort(byName).map(a => ({
      name: a.name,
      villages: [...a.villages.values()].sort(byName)
    }))
  }));
}

// ---------- listings screen ----------
function renderListings() {
  const allDistricts = [...new Map(state.houses.map(h => [key(h.district), norm(h.district)])).entries()]
    .sort((a, b) => a[1].localeCompare(b[1]));
  root().innerHTML = `
    <div class="top-bar">
      ${BRAND_HTML}
      <input id="search" type="search" placeholder="Search area, village or title…" value="${escapeHtml(state.search)}">
      <div class="chip-row">
        <button class="chip ${state.district === "all" ? "active" : ""}" data-district="all">All districts</button>
        ${allDistricts.map(([k, name]) => `<button class="chip ${state.district === k ? "active" : ""}" data-district="${escapeHtml(k)}">${escapeHtml(name)}</button>`).join("")}
      </div>
    </div>
    <div id="results"></div>`;
  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; renderResults(); });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    state.district = c.dataset.district;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === c));
    renderResults();
  }));
  renderResults();
}

function houseCard(h) {
  const paths = h.image_paths || [];
  const gallery = paths.length
    ? paths.map((p, i) => `<img src="${escapeHtml(photoUrl(p))}" alt="${escapeHtml(h.title)} photo ${i + 1}" loading="lazy">`).join("")
    : `<div class="no-photo">🏠</div>`;
  const where = [h.village, h.area, h.district].map(norm).filter(Boolean).join(", ");
  return `
    <div class="house-card">
      <div class="gallery">${gallery}</div>
      ${paths.length > 1 ? `<div class="photo-count">${paths.length} photos · swipe to see all →</div>` : ""}
      <div class="house-body">
        <div class="house-rent">${escapeHtml(fmtRent(h.rent_ugx))} <small>/ month</small></div>
        <div class="house-title">${escapeHtml(h.title)}</div>
        <div class="house-meta">📍 ${escapeHtml(where)}${h.bedrooms ? ` · 🛏️ ${escapeHtml(String(h.bedrooms))} bedroom${h.bedrooms == 1 ? "" : "s"}` : ""}</div>
        ${h.description ? `<p class="house-desc">${escapeHtml(h.description)}</p>` : ""}
        <button class="btn-whatsapp" data-house="${escapeHtml(h.id)}">💬 I like this house, chat on WhatsApp</button>
      </div>
    </div>`;
}

function renderResults() {
  const box = document.getElementById("results");
  const list = visibleHouses();
  if (!list.length) {
    box.innerHTML = `<div class="empty-box">No houses found${state.search || state.district !== "all" ? " for that search" : " yet. Please check back soon"}.</div>`;
    return;
  }
  box.innerHTML = groupHouses(list).map(d => `
    <h2 class="district-title">${escapeHtml(d.name)}</h2>
    ${d.areas.map(a => `
      <div class="area-title">${escapeHtml(a.name)}</div>
      ${a.villages.map(v => `
        ${v.name ? `<div class="village-title">${escapeHtml(v.name)}</div>` : ""}
        ${v.houses.map(houseCard).join("")}`).join("")}`).join("")}`).join("");
  box.querySelectorAll(".btn-whatsapp").forEach(b => b.addEventListener("click", () => chatOnWhatsApp(b.dataset.house)));
}

function chatOnWhatsApp(id) {
  const h = state.houses.find(x => x.id === id);
  if (!h) return;
  const where = [h.village, h.area, h.district].map(norm).filter(Boolean).join(", ");
  const msg = `Hello, I am interested in this house on newplus.app:\n${h.title}\n📍 ${where}\n💰 ${fmtRent(h.rent_ugx)} per month\nIs it still available?`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
}
</script>
</body>
</html>
